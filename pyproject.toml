[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-portfolio-assistant"
version = "0.1.0"
description = "Local portfolio document ingestion and chunking; Phase 1 of a RAG assistant."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
portfolio-ingest = "backend.ingestion:main"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

