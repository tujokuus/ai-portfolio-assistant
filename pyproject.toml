[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-portfolio-assistant"
version = "0.1.0"
description = "Local portfolio ingestion and semantic retrieval for a RAG assistant."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
retrieval = ["sentence-transformers>=3.4,<6", "chromadb>=1.0.20,<2"]

[project.scripts]
portfolio-ingest = "backend.ingestion:main"
portfolio-search = "backend.retrieval:main"
portfolio-index = "backend.indexing:main"
portfolio-evaluate = "backend.evaluation:main"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

